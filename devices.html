<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerStep Grid — إدارة الأجهزة والمباني</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <div class="title">⚡ PowerStep Grid Control</div>
    <div class="subtitle">Sci-Fi AI Dashboard — إدارة المباني والأجهزة (Multi-Node)</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
    <button id="themeToggleBtn" class="theme-toggle-btn" title="تغيير المظهر (Dark/Light)">🌙</button>
  </div>
</header>

<div style="max-width:1300px; margin:10px auto; padding:0 26px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
  <div class="nav-links">
    <a href="/">🏠 لوحة التحكم</a>
    <a href="/analytics.html">📊 التحليلات</a>
    <a href="/devices.html" class="active">🔧 الأجهزة</a>
  </div>
</div>

<main style="max-width:1300px; margin: 20px auto; padding: 0 26px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:15px;">
    <h2 style="color:var(--green); margin:0;">قائمة المباني والأجهزة المتصلة</h2>
    <button class="btn-export" onclick="showAddDeviceModal()" style="background:var(--blue); border-color:#0099cc; color:#fff; box-shadow:0 0 15px rgba(0,204,255,0.3);">+ إضافة مبنى / جهاز جديد</button>
  </div>

  <div class="grid4" id="devicesContainer">
    <!-- Devices will be injected here via JS -->
  </div>
</main>

<!-- Add Device Modal -->
<div id="deviceModal" class="modal-overlay hidden">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
      <h3 style="color:var(--blue); margin:0;">إضافة جهاز / مبنى جديد</h3>
      <button onclick="hideAddDeviceModal()" style="background:transparent; border:none; color:var(--red); font-size:1.2rem; cursor:pointer;">✖</button>
    </div>
    
    <div class="setting-group">
      <label>اسم المبنى / الجهاز</label>
      <input type="text" id="devName" placeholder="مثال: مبنى الهندسة" style="padding:10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink);">
    </div>
    <div class="setting-group">
      <label>الموقع (Location)</label>
      <input type="text" id="devLocation" placeholder="مثال: الدور الأول" style="padding:10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink);">
    </div>
    <div class="setting-group">
      <label>عدد البلاطات (Tiles)</label>
      <input type="number" id="devTiles" value="16" min="1" max="100" style="padding:10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink);">
    </div>
    <div style="display:flex; gap:10px; margin-top:25px;">
      <button class="btn-export" style="flex:1; background:var(--blue); border-color:#0099cc; color:#fff; justify-content:center;" onclick="saveNewDevice()">إضافة وحفظ</button>
      <button class="btn-export" style="flex:1; background:transparent; border-color:var(--muted); color:var(--ink); justify-content:center;" onclick="hideAddDeviceModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="devices.js"></script>
</body>
</html>
